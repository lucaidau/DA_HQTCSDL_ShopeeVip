<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tất Cả Đơn Hàng - Shopee Kênh Người Bán</title>
  <link rel="stylesheet" href="../CSS/tatcadonhang.css" />
</head>

<body>
  <div class="page-wrapper">
    <div class="top-orange-bar"></div>
    <header class="header">
      <div class="header-left">
        <span class="logo-icon">🛍️</span>
        <a href="kenhbanhang.html" class="logo-text">Shopee</a>
        <span class="header-title">Kênh Người Bán</span>
      </div>
      <div class="header-right">
        <div class="user-profile">
          <img src="https://ui-avatars.com/api/?name=U+T&background=random" class="user-avatar" alt="Avatar" />
          <span class="user-name"></span>
        </div>
      </div>
    </header>

    <div class="main-wrapper">
      <div class="main-content">
        <div class="page-title-section">
          <h1>Tất cả đơn hàng</h1>
        </div>

        <section class="panel">
          <div class="order-tabs">
            <div class="tab-item active" data-status="all">Tất cả</div>
            <div class="tab-item" data-status="pending">Chờ xác nhận</div>
            <div class="tab-item" data-status="shipping">Chờ lấy hàng</div>
            <div class="tab-item" data-status="delivering">Đang giao</div>
            <div class="tab-item" data-status="completed">Đã giao</div>
            <div class="tab-item" data-status="cancelled">Đã hủy</div>
          </div>

          <div class="filter-section">
            <input type="text" id="searchInput" class="search-input" placeholder="Nhập Mã ĐH, Tên người mua hoặc Tên sản phẩm..." />
            <button id="searchBtn" class="btn btn-secondary">Tìm kiếm</button>
          </div>

          <div id="orderListContainer" class="order-list">
            </div>
        </section>
      </div>
    </div>
  </div>

  <div id="infoModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modalTitle" class="modal-title">Tiêu đề</div>
      <div id="modalBody" class="modal-body">Nội dung</div>
    </div>
  </div>

  <script src="../JS/seller-header.js"></script>
  <script src="../JS/tatcadonhang.js"></script>
</body>

</html>
