<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopee Vip</title>
    <link rel="stylesheet" href="../CSS/index.css" />
  </head>
  <body>
    <div id="auth-overlay">
      <form class="auth-box" onsubmit="event.preventDefault()" id="login-box">
        <h2>Đăng nhập</h2>
        <div class="box">
          <input type="text" id="login-username" placeholder="Tên đăng nhập" />
          <input type="password" id="login-password" placeholder="Mật khẩu" />

          <div class="login-btn">
            <button type="submit" id="btn-login" class="btn-main">
              Đăng nhập
            </button>
          </div>
        </div>

        <div class="divider">HOẶC</div>
        <div class="switch-auth">
          Bạn mới biết đến Shopee? <span onclick="toggleAuth()">Đăng ký</span>
        </div>
      </form>

      <form
        class="auth-box"
        onsubmit="event.preventDefault()"
        id="register-box"
        style="display: none"
      >
        <h2>Đăng ký</h2>
        <input type="text" id="reg-username" placeholder="Tên đăng nhập" />
        <input type="text" id="reg-name" placeholder="Họ và Tên" />
        <input type="text" id="reg-phone" placeholder="Số điện thoại" />
        <input type="email" id="reg-mail" placeholder="Email" />
        <input type="password" id="reg-pass" placeholder="Mật khẩu" />

        <div class="gender-row">
          <span>Vai trò:</span>
          <select
            id="reg-role"
            style="
              padding: 6px 10px;
              border: 1px solid #dbdbdb;
              border-radius: 2px;
              outline: none;
              flex: 1;
              cursor: pointer;
            "
          >
            <option value="1">Người dùng</option>
            <option value="2">Người bán</option>
          </select>
        </div>

        <div class="gender-row">
          <span>Giới tính:</span>
          <select
            id="reg-gender"
            style="
              padding: 6px 10px;
              border: 1px solid #dbdbdb;
              border-radius: 2px;
              outline: none;
              flex: 1;
              cursor: pointer;
            "
          >
            <option value="1">Nam</option>
            <option value="2">Nữ</option>
          </select>
        </div>

        <button type="submit" id="btn-reg" class="btn-main">
          Đăng ký ngay
        </button>
        <div class="divider">HOẶC</div>
        <div class="switch-auth">
          Bạn đã có tài khoản? <span onclick="toggleAuth()">Đăng nhập</span>
        </div>
      </form>
    </div>

    <script src="../JS/index.js"></script>
  </body>
</html>
